theme = "dark_plus"

[editor]
bufferline = "always"
cursorline = true
line-number = "relative"
end-of-line-diagnostics = "hint"
# clipboard-provider = "tmux" #use when using with tmux
default-yank-register = "+"

[editor.cursor-shape]
insert = "bar"
select = "underline"

[keys.normal]
C-r = ":reload-all"
tab = ":buffer-next"
S-tab = ":buffer-previous"
A-s = ":w"
up = "scroll_up"
down = "scroll_down"
D = ["ensure_selections_forward", "extend_to_line_end", "delete_selection"]
0 = "goto_line_start"
"$" = "goto_line_end"
"^" = "goto_first_nonwhitespace"
G = "goto_file_end"
V = ["select_mode", "extend_to_line_bounds"]
esc = ["collapse_selection", "keep_primary_selection"]

[keys.normal.space]
e = { w = ":write", c = ":bc", x = ":bco", l = ":toggle lsp.display-inlay-hints" }
q = ":quit"

[keys.normal.space.f]
f = "file_picker_in_current_directory"
F = "file_picker"
b = "file_picker_in_current_buffer_directory"
"." = ":toggle-option file-picker.git-ignore"
g = "global_search"
e = "file_explorer"
r = ":reload-all"
x = ":reset-diff-change"
w = ":echo %sh{git blame -L %{cursor_line},+1 %{buffer_name}}"
d = [":vsplit-new", ":lang diff", ":insert-output git diff"]

[keys.normal."+"]
f = ":format"
w = ":toggle whitespace.render all"
W = ":set whitespace.render none"
s = ":toggle soft-wrap.enable"
# C-y = [
#   ':sh rm -f /tmp/unique-file',
#   ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/unique-file',
#   ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
#   ':open %sh{cat /tmp/unique-file}',
#   ':redraw',
# ]
# C-c = [':sh claude -p "%{selection}"']
# X = ":buffer-close"
# C-x = ":q!"
# C-h = [
#     ":write-all",
#     ":new",
#     ":insert-output lazygit",
#     ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
#     ":buffer-close!",
#     ":redraw",
#     ":reload-all"
# ]
A-r = ":config-reload"

[editor.inline-diagnostics]
cursor-line = "warning"


[editor.statusline]
left = [
  "mode",
  "spinner",
  "version-control",
  "spacer",
  "separator",
  "file-name",
  "read-only-indicator",
  "file-modification-indicator",

]
center = []
right = [
  "diagnostics",
  "workspace-diagnostics",
  "position",
  "total-line-numbers",
  "position-percentage",
  "file-encoding",
  "file-line-ending",
  "file-type",
  "register",
  "selections",
]

[editor.indent-guides]
render = true

[keys.select]
i = "select_textobject_inner"
a = "select_textobject_around"
0 = "goto_line_start"
"$" = "goto_line_end"
"^" = "goto_first_nonwhitespace"
G = "goto_file_end"
D = ["extend_to_line_bounds", "delete_selection", "normal_mode"]
k = ["extend_line_up", "extend_to_line_bounds"]
j = ["extend_line_down", "extend_to_line_bounds"]

